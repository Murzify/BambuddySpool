name: Set up JDK and Gradle
description: Configure the pinned JDK 17 and safe Gradle dependency cache.

inputs:
  cache-read-only:
    description: Prevent this job from writing Gradle cache entries.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: "17"
        check-latest: false

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
